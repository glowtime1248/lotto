<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b24">
<title>로또 번호 추첨</title>
<style>
  :root {
    --bg-top: #0b1240;
    --bg-bottom: #03051a;
    --gold: #ffd54a;
    --gold-deep: #e0a800;
    --text: #f4f6ff;
    --text-dim: #aab3e0;
    --ball-size: clamp(46px, 13vw, 78px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 0%, #1b2a7a 0%, var(--bg-top) 40%, var(--bg-bottom) 100%);
    background-color: var(--bg-bottom);
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 별 배경 ---------- */
  #stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: 0.2;
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .star.big {
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
  }
  .star.sparkle {
    background: transparent;
    width: 14px !important;
    height: 14px !important;
  }
  .star.sparkle::before,
  .star.sparkle::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    background: #fff;
    border-radius: 2px;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.9);
  }
  .star.sparkle::before { width: 2px; height: 14px; }
  .star.sparkle::after  { width: 14px; height: 2px; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }

  /* 스포트라이트 */
  .spotlight {
    position: fixed;
    top: -20vh;
    width: 40vw;
    height: 140vh;
    pointer-events: none;
    z-index: 0;
    background: linear-gradient(to bottom, rgba(120, 160, 255, 0.18), rgba(120, 160, 255, 0));
    filter: blur(20px);
    transform-origin: top center;
  }
  .spotlight.left  { left: 0;  animation: sweepL 9s ease-in-out infinite; }
  .spotlight.right { right: 0; animation: sweepR 9s ease-in-out infinite; }
  @keyframes sweepL { 0%,100% { transform: rotate(-25deg); } 50% { transform: rotate(5deg); } }
  @keyframes sweepR { 0%,100% { transform: rotate(25deg); }  50% { transform: rotate(-5deg); } }

  /* ---------- 메인 ---------- */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #fff;
    background: linear-gradient(90deg, #ff3d6e, #ff8a3d);
    box-shadow: 0 0 18px rgba(255, 80, 110, 0.6);
    margin-bottom: 14px;
  }
  .badge .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    margin-right: 6px;
    vertical-align: 1px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  h1 {
    font-size: clamp(32px, 9vw, 60px);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.1;
    background: linear-gradient(180deg, #fff8d6 0%, var(--gold) 45%, var(--gold-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 210, 70, 0.55)) drop-shadow(0 4px 0 rgba(120, 70, 0, 0.6));
  }

  .subtitle {
    margin-top: 10px;
    color: var(--text-dim);
    font-size: clamp(14px, 3.6vw, 17px);
  }

  /* ---------- 추첨판 ---------- */
  .stage {
    position: relative;
    margin: 32px auto 36px;
    padding: clamp(22px, 5vw, 36px) clamp(12px, 4vw, 28px);
    border-radius: 28px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
      rgba(10, 18, 70, 0.55);
    border: 2px solid rgba(255, 213, 74, 0.55);
    box-shadow:
      0 0 0 6px rgba(255, 213, 74, 0.08),
      0 0 40px rgba(255, 213, 74, 0.25),
      inset 0 0 40px rgba(80, 120, 255, 0.25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  /* 전광판 테두리 전구 */
  .bulbs {
    position: absolute;
    left: 18px; right: 18px;
    height: 8px;
    display: flex;
    justify-content: space-between;
  }
  .bulbs.top    { top: 8px; }
  .bulbs.bottom { bottom: 8px; }
  .bulbs span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ffe27a;
    box-shadow: 0 0 8px 2px rgba(255, 220, 100, 0.9);
    animation: bulb 1.2s ease-in-out infinite;
  }
  .bulbs span:nth-child(even) { animation-delay: 0.6s; }
  @keyframes bulb { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  .balls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(6px, 2.2vw, 16px);
    min-height: calc(var(--ball-size) + 30px);
    padding: 12px 0;
  }

  .placeholder {
    width: var(--ball-size);
    height: var(--ball-size);
    border-radius: 50%;
    border: 2px dashed rgba(170, 179, 224, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(170, 179, 224, 0.5);
    font-weight: 800;
    font-size: calc(var(--ball-size) * 0.36);
  }

  /* ---------- 공 ---------- */
  .ball {
    position: relative;
    width: var(--ball-size);
    height: var(--ball-size);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: calc(var(--ball-size) * 0.4);
    color: #fff;
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.45);
    background: radial-gradient(circle at 32% 28%, var(--c-light) 0%, var(--c-main) 45%, var(--c-dark) 100%);
    box-shadow:
      inset -6px -8px 14px rgba(0, 0, 0, 0.35),
      inset 4px 5px 10px rgba(255, 255, 255, 0.35),
      0 10px 18px rgba(0, 0, 0, 0.5),
      0 0 22px var(--c-glow);
    animation: popIn 0.9s cubic-bezier(.3,.7,.4,1) both;
  }
  /* 하이라이트 광택 */
  .ball::before {
    content: "";
    position: absolute;
    top: 9%;
    left: 18%;
    width: 38%;
    height: 26%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 75%);
    transform: rotate(-30deg);
  }
  /* 바닥 그림자 */
  .ball::after {
    content: "";
    position: absolute;
    bottom: -16px;
    left: 15%;
    width: 70%;
    height: 8px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    filter: blur(3px);
    animation: shadowIn 0.9s cubic-bezier(.3,.7,.4,1) both;
  }
  .ball span { position: relative; z-index: 1; }

  .ball.yellow { --c-light:#fff6b0; --c-main:#fbc400; --c-dark:#b07d00; --c-glow:rgba(251,196,0,0.55); color:#fff; }
  .ball.blue   { --c-light:#b9e3ff; --c-main:#2d8cf0; --c-dark:#0b4a9a; --c-glow:rgba(45,140,240,0.55); }
  .ball.red    { --c-light:#ffb3b3; --c-main:#f0453a; --c-dark:#9a1a12; --c-glow:rgba(240,69,58,0.55); }
  .ball.gray   { --c-light:#e8e8ee; --c-main:#8f929e; --c-dark:#4a4c56; --c-glow:rgba(180,180,195,0.45); }
  .ball.green  { --c-light:#c4f7a8; --c-main:#4cbb2a; --c-dark:#1f6e0e; --c-glow:rgba(76,187,42,0.55); }

  @keyframes popIn {
    0%   { opacity: 0; transform: translateY(-140px) scale(0.3) rotate(-180deg); }
    40%  { opacity: 1; transform: translateY(0) scale(1.15, 0.85) rotate(0deg); }
    55%  { transform: translateY(-34px) scale(0.95, 1.05); }
    70%  { transform: translateY(0) scale(1.08, 0.92); }
    82%  { transform: translateY(-10px) scale(1); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes shadowIn {
    0%   { opacity: 0; transform: scaleX(0.2); }
    40%  { opacity: 1; transform: scaleX(1.1); }
    55%  { opacity: 0.5; transform: scaleX(0.7); }
    70%  { opacity: 1; transform: scaleX(1.05); }
    82%  { opacity: 0.8; transform: scaleX(0.9); }
    100% { opacity: 1; transform: scaleX(1); }
  }

  /* 공이 나올 때 퍼지는 빛 */
  .burst {
    position: absolute;
    inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--c-glow) 0%, transparent 65%);
    animation: burst 0.8s ease-out 0.3s both;
    pointer-events: none;
  }
  @keyframes burst {
    0%   { opacity: 0; transform: scale(0.4); }
    40%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.8); }
  }

  .status {
    margin-top: 18px;
    min-height: 1.5em;
    font-size: clamp(14px, 3.8vw, 17px);
    color: var(--text-dim);
    font-weight: 600;
  }
  .status.done {
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255, 213, 74, 0.6);
  }

  /* ---------- 버튼 ---------- */
  .draw-btn {
    position: relative;
    width: min(100%, 320px);
    padding: 22px 32px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 900;
    letter-spacing: 0.06em;
    color: #3a1d00;
    cursor: pointer;
    background: linear-gradient(180deg, #fff1a8 0%, var(--gold) 45%, #f2a900 100%);
    box-shadow:
      0 8px 0 #a86a00,
      0 14px 24px rgba(0, 0, 0, 0.5),
      0 0 30px rgba(255, 200, 50, 0.55),
      inset 0 2px 0 rgba(255, 255, 255, 0.8);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.2s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  .draw-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.7), transparent);
    transform: skewX(-20deg);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 60% { left: -60%; }
    100%    { left: 130%; }
  }
  .draw-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .draw-btn:active:not(:disabled),
  .draw-btn.pressed {
    transform: translateY(6px) scale(0.98);
    box-shadow:
      0 2px 0 #a86a00,
      0 4px 10px rgba(0, 0, 0, 0.5),
      0 0 20px rgba(255, 200, 50, 0.45),
      inset 0 2px 0 rgba(255, 255, 255, 0.6);
  }
  .draw-btn:disabled {
    cursor: not-allowed;
    filter: grayscale(0.5) brightness(0.8);
  }
  .draw-btn:disabled::before { animation: none; }
  .draw-btn:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
  }

  footer {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(170, 179, 224, 0.55);
  }

  @media (max-width: 420px) {
    :root { --ball-size: clamp(34px, calc((100vw - 120px) / 6), 56px); }
    .balls { flex-wrap: nowrap; gap: 6px; }
    .stage { border-radius: 22px; padding-left: 10px; padding-right: 10px; }
    .ball::after { bottom: -12px; height: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .spotlight, .bulbs span, .draw-btn::before, .badge .dot { animation: none !important; }
    .ball, .ball::after { animation-duration: 0.01s !important; }
  }
</style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <div class="spotlight left" aria-hidden="true"></div>
  <div class="spotlight right" aria-hidden="true"></div>

  <main>
    <div class="badge"><span class="dot"></span>LIVE</div>
    <h1>행운의 로또 추첨</h1>
    <p class="subtitle">1부터 45까지, 오늘의 행운 번호 6개를 뽑아보세요!</p>

    <section class="stage" aria-label="추첨 결과">
      <div class="bulbs top" aria-hidden="true"></div>
      <div class="balls" id="balls" aria-live="polite"></div>
      <p class="status" id="status">버튼을 눌러 추첨을 시작하세요</p>
      <div class="bulbs bottom" aria-hidden="true"></div>
    </section>

    <button class="draw-btn" id="drawBtn" type="button">번호 뽑기</button>

    <footer>재미로만 즐겨주세요 · 번호는 무작위로 생성됩니다</footer>
  </main>

<script>
(function () {
  const BALL_COUNT = 6;
  const MAX_NUMBER = 45;
  const INTERVAL_MS = 500;

  const ballsEl = document.getElementById('balls');
  const statusEl = document.getElementById('status');
  const drawBtn = document.getElementById('drawBtn');

  /* ----- 별 만들기 ----- */
  function createStars() {
    const container = document.getElementById('stars');
    const area = window.innerWidth * window.innerHeight;
    const count = Math.min(220, Math.max(80, Math.round(area / 6000)));
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      const r = Math.random();
      s.className = 'star' + (r > 0.95 ? ' sparkle' : r > 0.8 ? ' big' : '');
      const size = r > 0.8 ? 2 + Math.random() * 2 : 1 + Math.random() * 1.5;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.setProperty('--dur', (2 + Math.random() * 4).toFixed(2) + 's');
      s.style.setProperty('--delay', (-Math.random() * 6).toFixed(2) + 's');
      frag.appendChild(s);
    }
    container.appendChild(frag);
  }

  /* ----- 전구 ----- */
  function createBulbs() {
    document.querySelectorAll('.bulbs').forEach(function (row) {
      const n = window.innerWidth < 480 ? 12 : 20;
      for (let i = 0; i < n; i++) row.appendChild(document.createElement('span'));
    });
  }

  /* ----- 안전한 난수 ----- */
  function randomInt(max) { // 0 ~ max-1
    if (window.crypto && window.crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / max) * max;
      let x;
      do { window.crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
      return x % max;
    }
    return Math.floor(Math.random() * max);
  }

  /* ----- 1~45 중 중복 없는 6개 ----- */
  function pickNumbers() {
    const pool = [];
    for (let i = 1; i <= MAX_NUMBER; i++) pool.push(i);
    for (let i = 0; i < BALL_COUNT; i++) {
      const j = i + randomInt(pool.length - i);
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    return pool.slice(0, BALL_COUNT).sort(function (a, b) { return a - b; });
  }

  function colorClass(n) {
    if (n <= 10) return 'yellow';
    if (n <= 20) return 'blue';
    if (n <= 30) return 'red';
    if (n <= 40) return 'gray';
    return 'green';
  }

  function showPlaceholders() {
    ballsEl.innerHTML = '';
    for (let i = 0; i < BALL_COUNT; i++) {
      const p = document.createElement('div');
      p.className = 'placeholder';
      p.textContent = '?';
      ballsEl.appendChild(p);
    }
  }

  function makeBall(n) {
    const b = document.createElement('div');
    b.className = 'ball ' + colorClass(n);
    b.setAttribute('aria-label', n + '번');
    const burst = document.createElement('div');
    burst.className = 'burst';
    const label = document.createElement('span');
    label.textContent = n;
    b.appendChild(burst);
    b.appendChild(label);
    return b;
  }

  let timers = [];

  function draw() {
    if (drawBtn.disabled) return;
    timers.forEach(clearTimeout);
    timers = [];

    const numbers = pickNumbers();
    drawBtn.disabled = true;
    statusEl.classList.remove('done');
    statusEl.textContent = '추첨 중입니다...';
    showPlaceholders();

    numbers.forEach(function (n, i) {
      timers.push(setTimeout(function () {
        const slot = ballsEl.children[i];
        ballsEl.replaceChild(makeBall(n), slot);
        statusEl.textContent = (i + 1) + '번째 번호: ' + n;
        if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }

        if (i === numbers.length - 1) {
          timers.push(setTimeout(function () {
            statusEl.textContent = '🎉 이번 회차 행운 번호: ' + numbers.join(', ');
            statusEl.classList.add('done');
            drawBtn.disabled = false;
            drawBtn.textContent = '다시 뽑기';
          }, 900));
        }
      }, INTERVAL_MS * (i + 1)));
    });
  }

  drawBtn.addEventListener('click', draw);

  createStars();
  createBulbs();
  showPlaceholders();
})();
</script>
</body>
</html>

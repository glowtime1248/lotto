/* ============ helpers ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function dstr(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
const today = () => dstr(new Date());
function addDays(s,n){ const [y,m,d]=s.split("-").map(Number); return dstr(new Date(y,m-1,d+n)); }
function dayDiff(a,b){ const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), ms))]); }
function useCap(name){ try{ return (window.claude && typeof window.claude.use==="function") ? window.claude.use(name).then(x=>x||null, ()=>null) : Promise.resolve(null); }catch(e){ return Promise.resolve(null); } }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
const norm = s => String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();

/* ============ storage (Claude db per-person, else this browser) ============ */
const Store = {
  mem:{}, col:null, timers:{}, mode:"local",
  async init(){
    try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith("pp:")) this.mem[k.slice(3)] = JSON.parse(localStorage.getItem(k)); } }catch(e){}
    const [db, user] = await Promise.all([useCap("db"), useCap("user")]);
    if(!db || !user) return;
    let id=null; try{ id = await user.id(); }catch(e){}
    if(!id) return;
    try{
      const col = db.collection("data/users/"+id);
      const snap = await withTimeout(col.get(), 10000);
      const remote = {};
      snap.docs.forEach(d => { const v = d.data(); if(v && "v" in v) remote[d.id] = v.v; });
      this.col = col; this.mode = "db";
      for(const k in this.mem) if(!(k in remote)) this.save(k, this.mem[k]);
      Object.assign(this.mem, remote);
    }catch(e){ console.warn("db unavailable", e); }
  },
  get(k, d){ return k in this.mem ? this.mem[k] : d; },
  keys(prefix){ return Object.keys(this.mem).filter(k => k.startsWith(prefix)); },
  save(k, v){ this.mem[k]=v; clearTimeout(this.timers[k]); this.timers[k]=setTimeout(()=>this.flush(k), 600); },
  async flush(k){ const v=this.mem[k]; try{ localStorage.setItem("pp:"+k, JSON.stringify(v)); }catch(e){} if(this.col){ try{ await this.col.doc(k).set({v}); }catch(e){ console.warn("save failed", k, e); } } },
  del(k){ delete this.mem[k]; clearTimeout(this.timers[k]); try{ localStorage.removeItem("pp:"+k); }catch(e){} if(this.col) this.col.doc(k).delete().catch(()=>{}); }
};
const Settings = {
  get rate(){ return Store.get("set",{}).rate ?? 0.95; },
  get voice(){ return Store.get("set",{}).voice || "buttery"; },
  get pause(){ return Store.get("set",{}).pause ?? 2.5; },
  get apiKey(){ try{ return localStorage.getItem("pp-key")||""; }catch(e){ return ""; } },
  set(k,v){ const s={...Store.get("set",{})}; s[k]=v; Store.save("set", s); }
};

/* ============ voice out ============ */
const Voice = {
  t:null,
  async speak(text, lang="en", rate){
    rate = clamp(rate ?? Settings.rate, 0.7, 1.5);
    if(!text) return;
    if(this.t){
      try{ await this.t.speak(text, {language: lang, rate, voice: Settings.voice}); return; }
      catch(e){ const c=e&&e.code; if(c==="not_granted"||c==="unavailable"){ this.t=null; } else { throw e; } }
    }
    return this.web(text, lang, rate);
  },
  web(text, lang, rate){
    return new Promise(res => {
      if(!("speechSynthesis" in window)) return res();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang==="ko" ? "ko-KR" : "en-US"; u.rate = rate;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace("_","-").startsWith(u.lang)); if(v) u.voice=v;
      u.onend = () => res(); u.onerror = () => res();
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    });
  },
  stop(){ if(this.t) this.t.stop().catch(()=>{}); try{ speechSynthesis.cancel(); }catch(e){} }
};
function say(text, lang, rate){ Voice.speak(text, lang, rate).catch(()=>{}); }

/* ============ voice in ============ */
const Mic = {
  d:null, Web: window.SpeechRecognition || window.webkitSpeechRecognition || null, rec:null,
  active:false, buf:"", partial:"", cb:null, silT:null, maxT:null, failed:false,
  attach(d){
    this.d = d; if(!d) return;
    d.onPartial(({text}) => { this.partial = text; this.live(); });
    d.onFinal(({text}) => { this.buf += (this.buf?" ":"") + text; this.partial = ""; this.live(); });
    d.onState(({state, reason}) => {
      if(state==="idle"){ this.active=false; if(reason==="not_granted"||reason==="unavailable"){ this.d=null; this.failed=true; } this.finish(); }
      this.paint();
    });
  },
  ok(){ return !!(this.d || (this.Web && !this.failed)); },
  toggle(cb){ if(this.active){ this.stop(); return; } this.start(cb); },
  start(cb){
    this.buf=""; this.partial=""; this.cb=cb; Voice.stop();
    clearTimeout(this.maxT); this.maxT = setTimeout(()=>this.stop(), 20000);
    if(this.d){
      this.active = true; this.paint();
      this.d.start({language:"en-US"}).catch(e => { this.active=false; if(e&&(e.code==="not_granted"||e.code==="unavailable")){ this.d=null; this.failed=!this.Web; } this.paint(); toast("마이크를 쓸 수 없어요. 스스로 말해 보고 정답 확인을 눌러 주세요."); render(); });
      return;
    }
    if(this.Web){
      const r = new this.Web(); r.lang="en-US"; r.interimResults=true; r.continuous=false;
      r.onresult = ev => { let f="", p=""; for(const x of ev.results){ if(x.isFinal) f+=x[0].transcript; else p+=x[0].transcript; } this.buf=f; this.partial=p; this.live(); };
      r.onerror = ev => { if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ this.failed=true; toast("마이크가 막혀 있어요. 스스로 말하기 모드로 바꿀게요."); } };
      r.onend = () => { this.active=false; this.paint(); this.finish(); if(this.failed) render(); };
      this.rec = r; this.active = true; this.paint();
      try{ r.start(); }catch(e){ this.active=false; this.failed=true; this.paint(); }
    }
  },

  async json(input, o={}){

    const msgs = [];
    for(const t of turns){ const last=msgs[msgs.length-1]; if(last && last.role===t.role) last.content[0].text += "\n\n"+t.content; else msgs.push({role:t.role, content:[{type:"text", text:t.content}]}); }
    if(o.images && o.images.length){
      const parts = await Promise.all(o.images.map(async b => ({type:"image", source:{type:"base64", media_type:"image/jpeg", data: await blobB64(b)}})));

    return parseLooseJSON(text);
  }
};
function blobB64(b){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(b); }); }

  try{ return JSON.parse(t); }catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} }

}

/* ============ phrase matching (articles, prepositions, -s matter) ============ */
const IRR = {take:["took","taken","taking","takes"], stick:["stuck","sticking","sticks"], make:["made","making","makes"], get:["got","gotten","getting","gets"], find:["found","finding","finds"], buy:["bought","buying","buys"], pay:["paid","paying","pays"], build:["built","building","builds"], keep:["kept","keeping","keeps"], go:["went","gone","going","goes"], have:["had","has","having"], do:["did","done","doing","does"], run:["ran","running","runs"], set:["setting","sets"], put:["putting","puts"], cut:["cutting","cuts"], spend:["spent","spending","spends"], save:["saved","saving","saves"]};
const POSS = ["my","your","his","her","their","our","its","one's"];
function forms(w){ w=w.toLowerCase(); if(IRR[w]) return [w, ...IRR[w]]; const base = w.endsWith("e") ? w.slice(0,-1) : w; return [w, w+"s", w+"es", w+"d", w+"ed", base+"ing", base+"ed", w.replace(/y$/,"ied"), w.replace(/y$/,"ies")]; }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function tokenWords(item){ const t = (item.tokens && item.tokens.length) ? item.tokens : item.en.split(/\s+/).map(w=>({t:w, r:"noun"})); const out=[]; t.forEach(tk => String(tk.t).split(/\s+/).filter(Boolean).forEach(w => out.push({w, r:tk.r}))); return out; }
function phraseRe(item, flags="i"){
  const parts = tokenWords(item).map(({w,r}) => {
    const lw = w.toLowerCase().replace(/[’]/g,"'");
    if(r==="poss" || lw==="one's") return "(?:my|your|his|her|their|our|its|one's|[a-z]+'s)";
    if(r==="verb") return "(?:"+[...new Set(forms(lw))].map(reEsc).join("|")+")";
    return reEsc(lw);
  });
  return new RegExp("\\b"+parts.join("[\\s]+")+"\\b", flags);
}
function highlight(text, item){
  text = String(text||""); const re = phraseRe(item, "i"); const src = text.replace(/[’]/g,"'"); const m = re.exec(src);
  if(!m) return esc(text);
  return esc(text.slice(0,m.index)) + "<mark>" + esc(text.slice(m.index, m.index+m[0].length)) + "</mark>" + esc(text.slice(m.index+m[0].length));
}
function judgeSpeech(item, text){
  const n = norm(text);
  if(!n) return {ok:false, empty:true, issues:[]};
  if(phraseRe(item).test(n)) return {ok:true, issues:[]};
  const words = n.split(" "); const issues=[];
  for(const {w,r} of tokenWords(item)){
    const lw = w.toLowerCase().replace(/[’]/g,"'");
    if(r==="poss" || lw==="one's"){ if(!words.some(x=>POSS.includes(x)||/'s$/.test(x))) issues.push(`소유격(my/your/her…)이 빠졌어요. one's 자리는 주어에 맞춰 바꿔 말해요.`); continue; }
    if(r==="verb"){ if(!words.some(x=>forms(lw).includes(x))) issues.push(`동사 '${lw}'가 들리지 않았어요. 이 표현은 ${lw}와 짝이에요.`); continue; }
    if(words.includes(lw)) continue;
    if(r==="pl"){ const sing = lw.replace(/(es|s)$/,""); issues.push(words.includes(sing) ? `'${sing}' 대신 복수형 '${lw}'로 말해야 해요 (끝소리 s).` : `'${lw}'가 빠졌어요.`); continue; }
    if(r==="art"){ const other = lw==="an"?"a":lw==="a"?"an":null; issues.push(other && words.includes(other) ? `관사는 '${other}'가 아니라 '${lw}'예요.` : `관사 '${lw}'가 빠졌어요.`); continue; }
    if(r==="prep"){ issues.push(`전치사 '${lw}'가 빠졌거나 다른 전치사를 썼어요.`); continue; }
    issues.push(`'${lw}'가 들리지 않았어요.`);
  }
  if(!issues.length) issues.push("단어는 다 있는데 순서나 덧붙인 말(예: 필요 없는 the)이 달라요. 정답과 비교해 보세요.");
  return {ok:false, issues};
}
const ROLE = {verb:"동사", adj:"형용사", adv:"부사(-ly)", noun:"명사", art:"관사", prep:"전치사", pl:"복수 -s", un:"셀 수 없음", poss:"소유격", pp:"과거분사", part:"부사 짝"};

/* ---------- drills ---------- */
function allItems(){ const out=[]; for(const L of lessons()) for(const it of L.items) out.push({lid:L.id, it}); return out; }
function makeTask(type, lid, iid){ return {type, lid, iid}; }
function prepTask(t){
  if(t.ready) return; t.ready=true; const it = itemOf(t.lid, t.iid);
  const q = it.quiz && (it.quiz.opts||[]).length>=2 ? it.quiz : null;
  if((t.type==="detail"||t.type==="reverse"||t.type==="build") && !q) t.type="listen";
  if(t.type==="detail"){ t.opts = shuffle(q.opts.slice(0,4).map(o=>({t:o.t, ok:!!o.ok, why:o.why||""}))); }
  if(t.type==="reverse"){ t.opts = shuffle(q.opts.slice(0,4).map(o=>({t:o.t, ok:!!o.ok, why:o.why||""}))); }
  if(t.type==="listen"){ const others = shuffle(allItems().filter(x=>x.it.ko!==it.ko)).slice(0,3).map(x=>({t:x.it.ko, ok:false, why:`이건 '${x.it.en}'의 뜻이에요.`})); t.opts = shuffle([{t:it.ko, ok:true, why:""}, ...others]); }
  if(t.type==="build"){
    const right = q.opts.find(o=>o.ok) || q.opts[0];
    const talk = (it.talk||[]).find(x => phraseRe(it).test(norm(x.en)) && x.en.split(" ").length<=12);
    const sentence = talk ? talk.en : q.s.replace(/_{2,}/, right.t);
    t.sentence = sentence; t.ko = talk ? talk.ko : it.ko;
    const words = sentence.replace(/\s+([,.!?])/g,"$1").split(/\s+/).map(w=>w.replace(/[.,!?;:"]+$/,"").replace(/^"/,"")).filter(Boolean);
    t.answer = words.map(w=>w.toLowerCase());
    const correctSet = new Set(norm(right.t).split(" "));
    const distract = [...new Set(q.opts.filter(o=>!o.ok).flatMap(o=>norm(o.t).split(" ")).filter(w=>w && !correctSet.has(w)))].slice(0,3);
    t.tiles = shuffle([...words, ...distract].map((w,i)=>({w, i})));
    t.placed = [];
  }
  if(t.type==="speak"){ const talk=(it.talk||[])[0]; t.ko = talk ? talk.ko : it.ko; t.model = talk ? talk.en : it.en; }
}
function startDrill(title, tasks, back, step){
  if(!tasks.length){ toast("연습할 표현이 없어요."); return; }
  go("drill", {drill:{title, tasks, i:0, back, step, results:[], answered:false, requeued:new Set()}});
}
function lessonDrill(type){
  const L = lessonById(S.lid); const ids = shuffle(L.items.map(i=>i.id));
  const names = {detail:"디테일 함정 퀴즈", build:"문장 조립", speak:"소리 내어 말하기", listen:"듣고 뜻 고르기", reverse:"한→영 고르기"};
  startDrill(names[type], ids.map(id=>makeTask(type, L.id, id)), "lesson", ({detail:"quiz", build:"build", speak:"speak"})[type]);
}
function reviewDrill(kind){
  let pairs=[];
  if(kind==="due") pairs = dueList().slice(0,25);
  else if(kind==="mix") pairs = shuffle(allItems().filter(x=>srs(x.lid)[x.it.id])).slice(0,15).map(x=>({lid:x.lid, iid:x.it.id}));
  else { const n = {d1:1, d2:2, d7:7}[kind]; for(const L of studiedOn(addDays(today(),-n))) for(const it of L.items) pairs.push({lid:L.id, iid:it.id}); }
  const types = ["reverse","detail","listen","build","speak"];
  const tasks = shuffle(pairs).map((p,i) => { const st = srs(p.lid)[p.iid]; const k = ((st&&st.reps)||0) + i; return makeTask(types[k % types.length], p.lid, p.iid); });
  const names = {due:"오늘의 복습", mix:"섞어서 복습", d1:"어제 배운 것", d2:"그저께 배운 것", d7:"일주일 전 배운 것"};
  S.lid = null; startDrill(names[kind], tasks, "home", null);
}
function viewDrill(){
  const D = S.drill; const t = D.tasks[D.i];
  if(!t) return drillSummary();
  prepTask(t); const it = itemOf(t.lid, t.iid);
  const pct = Math.round(D.i / D.tasks.length * 100);
  let body = "";
  const fb = D.answered ? feedbackHTML(t, it) : "";
  if(t.type==="detail"){
    const s = esc(it.quiz.s).replace(/_{2,}/, '<span class="blank"></span>');
    body = `<div class="eyebrow">디테일 함정 · 빈칸에 딱 맞는 것</div><p class="q">${s}</p>
      <div class="opts">${t.opts.map((o,k)=>optBtn(t,o,k,false)).join("")}</div>`;
  } else if(t.type==="reverse"){
    body = `<div class="eyebrow">한 → 영 · 디테일까지 정확한 것</div><p class="prompt-ko">${esc(it.emoji||"")} ${esc(it.ko)}</p><div class="opts">${t.opts.map((o,k)=>optBtn(t,o,k,false)).join("")}</div>`;
  } else if(t.type==="listen"){
    body = `<div class="eyebrow">듣고 뜻 고르기</div><div class="row"><button class="btn soft" data-act="say" data-text="${esc(it.en)}">🔊 다시 듣기</button><button class="btn ghost" data-act="say" data-text="${esc(it.en)}" data-rate="0.75">🐢 천천히</button></div>
      ${D.answered?`<p class="q">${esc(it.en)}</p>`:""}<div class="opts" style="margin-top:12px">${t.opts.map((o,k)=>optBtn(t,o,k,true)).join("")}</div>`;
  } else if(t.type==="build"){
    const placed = t.placed.map(i => t.tiles.find(x=>x.i===i));
    body = `<div class="eyebrow">문장 조립 · 함정 타일이 섞여 있어요</div><p class="prompt-ko">${esc(t.ko)}</p>

function answer(correct, q){

/* ---------- AI chat ---------- */
function chatRules(L){
  return `You are a friendly English conversation partner for a Korean learner (IELTS level, intermediate). Role-play a natural everyday situation related to "${L.title} ${L.topic||""}".
TARGET EXPRESSIONS (id: phrase = Korean):
${L.items.map(i=>`${i.id}: ${i.en} = ${i.ko}`).join("\n")}
Each turn: reply in 1-2 short natural sentences, then ask ONE question that invites the learner to use a target expression they have not used yet.
Check the learner's LAST message strictly for the small details: articles (a/an/the/none), prepositions, plural -s, countable/uncountable, -ly adverbs, the right verb (e.g. place an order, not make an order), one's → my/your.
Reply ONLY with JSON:
{"reply":"your English line","reply_ko":"Korean translation","feedback":"Korean, 1-2 sentences about the learner's last message: praise correct target use or explain the detail mistake and WHY; empty string at the start","fixed":"corrected learner sentence, or empty if it was correct","used":["ids of target expressions the learner used correctly in the last message"],"suggestions":[{"en":"a possible learner reply using an unused target expression","ko":"Korean","bad":false,"why":""},{"en":"...","ko":"...","bad":false,"why":""},{"en":"a reply with exactly ONE subtle detail error in a target expression","ko":"...","bad":true,"why":"Korean: what is wrong and the rule"}]}
Put the suggestions in random order.`;
}
async function chatCall(){
  const C=S.chat; const L=lessonById(S.lid); C.busy=true; C.err=""; render();
  const turns=[{role:"user", content:chatRules(L)}, ...C.turns.slice(-14)];
  if(turns.length===1) turns.push({role:"user", content:"Start the conversation now with a friendly opening line and a question."});
  C.ctl = new AbortController();
  try{
    const r = await AI.json(turns, {tier:"quick", cache:false, signal:C.ctl.signal});
    const reply = String(r.reply||"").trim(); if(!reply) throw {code:"invalid_json"};
    const last = C.msgs[C.msgs.length-1];
    if(last && last.who==="me"){ last.fb = String(r.feedback||""); last.fixed = String(r.fixed||""); }
    (Array.isArray(r.used)?r.used:[]).forEach(id => { if(L.items.some(i=>i.id===id)){ C.used.add(String(id)); grade(L.id, String(id), 5); } });
    C.msgs.push({who:"ai", en:reply, ko:String(r.reply_ko||"")});
    C.turns.push({role:"assistant", content:reply});
    C.sugg = (Array.isArray(r.suggestions)?r.suggestions:[]).slice(0,3).map(s=>({en:String(s.en||""), ko:String(s.ko||""), bad:!!s.bad, why:String(s.why||"")})).filter(s=>s.en);
    C.busy=false; render(); say(reply);
    if(C.used.size >= Math.min(5, L.items.length)) markStep(L.id, "chat");
  }catch(e){ C.busy=false; C.err = aiErr(e); render(); }
}
function chatSend(text){
  const C=S.chat; if(!text || C.busy) return;
  C.msgs.push({who:"me", en:text}); C.turns.push({role:"user", content:"Learner: "+text}); C.sugg=[]; chatCall();
}

async function hfLoop(){
  const H=S.hf; if(H.running) return; H.running=true; H.stop=false;
  try{ H.lock = await navigator.wakeLock?.request("screen"); }catch(e){}
  const phase = p => { H.phase=p; const el=$("#hf-phase"); if(el) el.textContent=p; };
  const L = lessonById(H.lid);
  while(H.playing && !H.stop && S.view==="hands"){
    const it = L.items[H.i]; const myI = H.i;
    const steps = [["🇺🇸 영어", ()=>Voice.speak(it.en,"en",Settings.rate*0.9)], ["🗣️ 따라 말해 보세요", ()=>sleep(Settings.pause*1000)]];
    if(H.ko) steps.push(["🇰🇷 뜻", ()=>Voice.speak(it.ko,"ko")]);
    steps.push(["🇺🇸 한 번 더", ()=>Voice.speak(it.en,"en")], ["🗣️ 따라 말해 보세요", ()=>sleep(Settings.pause*1000)]);
    if(H.ex){ const t=(it.talk||[])[0]; if(t){ steps.push(["💬 회화 문장", ()=>Voice.speak(t.en,"en")], ["🗣️ 따라 말해 보세요", ()=>sleep(Settings.pause*1300)]); } }
    for(const [p,fn] of steps){ if(!H.playing||H.stop||H.i!==myI) break; phase(p); try{ await fn(); }catch(e){ if(e&&e.code==="viewer_stopped") H.playing=false; break; } await sleep(350); }
    if(!H.playing||H.stop) break;
    if(H.i===myI){ if(H.shuffle){ let n=H.i; while(L.items.length>1 && n===H.i) n=Math.random()*L.items.length|0; H.i=n; } else { H.i=H.i+1; if(H.i>=L.items.length){ H.i=0; H.round++; } } }
    render();
  }
  H.running=false; try{ H.lock?.release(); }catch(e){}
}

async function prepImages(file, perPhoto){
  const bmp = await createImageBitmap(file);
  const W=bmp.width, H=bmp.height; const crops=[];
  if(perPhoto>=3) crops.push([0,1],[0,0.56],[0.44,1]); else if(perPhoto===2) crops.push([0,0.56],[0.44,1]); else crops.push([0,1]);
  const out=[];
  for(const [a,b] of crops){
    const sy=Math.round(H*a), sh=Math.round(H*(b-a)); const sc=Math.min(1, Math.sqrt(1.2e6/(W*sh)));

async function runExtract(){
  const A=S.add; A.stage="extracting"; A.err=""; A.log=[]; A.ctl=new AbortController(); render();
  const max = AI.maxImages(); const per = max>=3 ? 3 : max>=2 ? 2 : 1;
  try{
    const results = [];
    const jobs = A.files.map((f,i) => async () => {
      A.log[i] = `⏳ 사진 ${i+1} 읽는 중`; render();
      const imgs = await prepImages(f, per);
      const r = await AI.json(EXTRACT_PROMPT(imgs.length), {images: imgs, signal: A.ctl.signal});
      results[i] = r; A.log[i] = `✅ 사진 ${i+1}: 표현 ${(r.items||[]).length}개`; render();
    });
    await runPool(jobs, 2);
    const seen=new Set(); const items=[];
    for(const r of results) for(const it of (r&&r.items)||[]){ const en=String(it.en||"").trim(); if(!en) continue; const k=norm(en); if(seen.has(k)) continue; seen.add(k);
      items.push({id: (norm(en).replace(/[^a-z0-9]+/g,"-").slice(0,24)||"x")+"-"+items.length, en, ko:String(it.ko||""), syn:String(it.syn||""), ant:String(it.ant||""), note:String(it.note||""), ex:{en:String(it.ex&&it.ex.en||""), ko:String(it.ex&&it.ex.ko||"")}}); }
    if(!items.length) throw {code:"none"};
    const r0 = results.find(Boolean)||{};
    Object.assign(A, {stage:"review", items, title:String(r0.title||"새 학습 "+today()), topic:String(r0.topic||"")});
  }catch(e){ A.stage="pick"; A.err = e&&e.code==="none" ? "사진에서 표현을 찾지 못했어요. 글자가 크게 보이도록 다시 찍어 주세요." : aiErr(e); }
  render();
}
async function runPool(jobs, n){ let k=0; const worker = async()=>{ while(k<jobs.length){ const j=jobs[k++]; await j(); } }; await Promise.all(Array.from({length:Math.min(n,jobs.length)}, worker)); }
async function runEnrich(){
  const A=S.add; const items = A.items.filter(i=>!i.off).map(({off,...r})=>r);
  A.stage="enriching"; A.err=""; A.log=[]; A.ctl=new AbortController(); render();
  const chunks=[]; for(let i=0;i<items.length;i+=5) chunks.push(items.slice(i,i+5));
  const enriched = {}; let story=null;

    const jobs = chunks.map((ch,ci) => async () => {
      A.log[ci] = `⏳ 원리·퀴즈·회화 ${ci+1}/${chunks.length}`; render();
      const arr = await AI.json(ENRICH_PROMPT(ch), {signal:A.ctl.signal});
      (Array.isArray(arr)?arr:(arr.items||[])).forEach(x => { if(x && x.id) enriched[x.id]=x; });
      A.log[ci] = `✅ 원리·퀴즈·회화 ${ci+1}/${chunks.length}`; render();
    });
    jobs.push(async () => { const si=chunks.length; A.log[si]="⏳ 기억궁전 스토리와 그림"; render(); story = await AI.json(STORY_PROMPT(A.title, items), {signal:A.ctl.signal}); A.log[si]="✅ 기억궁전 스토리와 그림"; render(); });
    await runPool(jobs, 3);

  const L = {id: uid(), title:A.title, topic:A.topic, createdAt: new Date().toISOString(), items: full, story: sanitizeStory(story, full)};

}
const ROLES = new Set(Object.keys(ROLE));
function sanitizeItem(x){
  const s = v => String(v ?? "");
  const tokens = Array.isArray(x.tokens) && x.tokens.length ? x.tokens.map(t=>({t:s(t.t), r: ROLES.has(t.r)?t.r:"noun"})).filter(t=>t.t) : x.en.split(/\s+/).map(w=>({t:w, r:"noun"}));
  const quiz = x.quiz && Array.isArray(x.quiz.opts) && x.quiz.opts.some(o=>o.ok) && /_{2,}/.test(s(x.quiz.s)) ? {s:s(x.quiz.s), opts:x.quiz.opts.slice(0,4).map(o=>({t:s(o.t), ok:!!o.ok, why:s(o.why)}))} : null;
  return {id:x.id, en:x.en, ko:x.ko, emoji:s(x.emoji).slice(0,8)||"📌", syn:s(x.syn), ant:s(x.ant), note:s(x.note), ex:{en:s(x.ex&&x.ex.en), ko:s(x.ex&&x.ex.ko)}, tokens,
    details:(Array.isArray(x.details)?x.details:[]).slice(0,5).map(d=>({k:s(d.k), d:s(d.d)})), quiz, mnem:s(x.mnem),
    talk:(Array.isArray(x.talk)?x.talk:[]).slice(0,3).map(t=>({en:s(t.en), ko:s(t.ko)})).filter(t=>t.en), qa: x.qa&&x.qa.q ? {q:s(x.qa.q), a:s(x.qa.a)} : null};
}
function sanitizeStory(st, items){
  if(!st || !Array.isArray(st.scenes)) return null;
  const ids = new Set(items.map(i=>i.id));
  return {title:String(st.title||"기억궁전 스토리"), scenes: st.scenes.slice(0,8).map(sc=>({place:String(sc.place||"generic"), title:String(sc.title||""), ko:String(sc.ko||""), en:String(sc.en||""), items:(sc.items||[]).map(String).filter(i=>ids.has(i)), props:(sc.props||[]).slice(0,6).map(p=>({e:String(p.e||"").slice(0,8), x:+p.x||160, y:+p.y||90, s:+p.s||34, id: ids.has(String(p.id))?String(p.id):""}))}))};
}

    const ctx=el.dataset.ctx;
    if(ctx==="shadow"){ const L=lessonById(el.dataset.lid || (S.sheet&&S.sheet.lid) || S.lid); const it=L && L.items.find(i=>i.id===el.dataset.id); Mic.toggle(text => { const box=$("#mic-result"); if(box && it) box.innerHTML = verdictHTML(it, text, judgeSpeech(it, text)); }); }
    else if(ctx==="drill"){ Mic.toggle(text => { const D=S.drill; const t=D.tasks[D.i]; if(!t || D.answered) return; const it=itemOf(t.lid,t.iid); t.heard=text; t.judge=judgeSpeech(it,text); if(t.judge.empty){ toast("소리가 들리지 않았어요. 다시 눌러 말해 보세요."); return; } answer(t.judge.ok, t.judge.ok?5:2); }); }
    else if(ctx==="chat"){ Mic.toggle(text => { if(text) chatSend(text); else toast("소리가 들리지 않았어요."); }); }
  },
  sugg(el){ const C=S.chat; const s=C.sugg[+el.dataset.k]; if(!s) return; if(s.bad){ s.revealed=true; render(); toast("함정이에요! 이유를 확인해 보세요."); return; } chatSend(s.en); },
  "chat-retry"(){ chatCall(); },
  hands(){ const lid = S.lid || (lessons()[0]&&lessons()[0].id); go("hands", {lid, hf:{lid, i:0, round:1, playing:false, ko:true, ex:true, shuffle:false}}); },
  "hf-toggle"(){ const H=S.hf; H.playing=!H.playing; H.stop=false; if(!H.playing) Voice.stop(); render(); if(H.playing) hfLoop(); },
  "hf-next"(){ const H=S.hf; const L=lessonById(H.lid); H.i=(H.i+1)%L.items.length; Voice.stop(); render(); },
  "hf-prev"(){ const H=S.hf; const L=lessonById(H.lid); H.i=(H.i-1+L.items.length)%L.items.length; Voice.stop(); render(); },
  "hf-ko"(){ S.hf.ko=!S.hf.ko; render(); }, "hf-ex"(){ S.hf.ex=!S.hf.ex; render(); },
  "hf-shuffle"(){ const H=S.hf; H.shuffle=!H.shuffle; render(); },
  add(){ go("add", {add:{stage:"pick", files:[], urls:[], items:[], log:[]}}); },
  "pick-photo"(){ $("#photo-input").click(); },
  "rm-photo"(el){ const A_=S.add; const i=+el.dataset.i; URL.revokeObjectURL(A_.urls[i]); A_.files.splice(i,1); A_.urls.splice(i,1); render(); },
  extract(){ runExtract(); },
  abort(){ S.add.ctl && S.add.ctl.abort(); },
  "toggle-item"(el){ const it=S.add.items[+el.dataset.i]; it.off=!it.off; render(); },
  enrich(){ runEnrich(); },
  "restart-add"(){ S.add.stage="pick"; S.add.err=""; render(); },
  "del-lesson"(el){ const lid=el.dataset.lid; if(el.dataset.armed!=="1"){ el.dataset.armed="1"; el.textContent="한 번 더 누르면 삭제돼요"; el.classList.add("on"); return; }
    if(lid===BUILTIN.id) setMeta(m=>{ m.hidden=[...(m.hidden||[]), lid]; }); else Store.del("L_"+lid); Store.del("S_"+lid); toast("삭제했어요."); go("home"); },
  "restore-builtin"(){ setMeta(m=>{ m.hidden=(m.hidden||[]).filter(x=>x!==BUILTIN.id); }); toast("Day 06 학습을 다시 보이게 했어요."); },
  voice(el){ Settings.set("voice", el.dataset.v); render(); },
  "save-key"(){ const v=$("#apikey").value.trim(); try{ localStorage.setItem("pp-key", v); }catch(e){} toast(v?"키를 저장했어요.":"키를 지웠어요."); render(); }
};
function next(){ const D=S.drill; D.i++; D.answered=false; render(); window.scrollTo(0,0); const t=D.tasks[D.i]; if(t){ prepTask(t); if(t.type==="listen") say(itemOf(t.lid,t.iid).en); } }
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.dataset.act==="close-sheet" && el.classList.contains("sheet-wrap") && ev.target!==el) return;
  if(el.tagName==="INPUT") return;
  fn(el, ev);
});
document.addEventListener("input", ev => {
  const el=ev.target; if(el.id==="rate"){ Settings.set("rate", +el.value); $("#rate-v").textContent=(+el.value).toFixed(2)+"×"; }
  if(el.id==="pause"){ Settings.set("pause", +el.value); $("#pause-v").textContent=el.value+"초"; }
});
$("#photo-input").addEventListener("change", ev => {
  const files=[...ev.target.files].filter(f=>/^image\//.test(f.type)); ev.target.value="";
  if(!S.add) return; files.forEach(f=>{ S.add.files.push(f); S.add.urls.push(URL.createObjectURL(f)); }); render();
});
document.addEventListener("keydown", ev => { if(ev.key==="Escape" && S.sheet){ S.sheet=null; render(); } });

/* ============ boot ============ */
render();
(async () => {
  useCap("tts").then(t => { if(t){ Voice.t=t; render(); } });
  useCap("dictation").then(d => { if(d){ Mic.attach(d); render(); } });
  useCap("sample").then(async s => { if(s){ AI.s=s; try{ AI.limits = await s.limits(); }catch(e){} } else AI.s = false; render(); });
  await Store.init(); render();
})();
</script>
